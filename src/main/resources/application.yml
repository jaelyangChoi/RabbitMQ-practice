spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guestuser
    password: guestuser
    listener:
      simple:
        retry:
          enabled: true # 재시도 활성화
          initial-interval: 1000 # 첫 재시도 간격 1초
          max-attempts: 3 # 최대 재시도 횟수
          max-interval: 10000 # 최대 재시도 간격 10초
        default-requeue-rejected: false # 재시도 실패 시 자동으로 DLQ로 이동

  application:
    name: HelloMessageQueue
server:
  port: 8080
